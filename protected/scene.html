<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TZ City scene</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f17; }
    canvas { display: block; }
    #hint { position: fixed; left: 12px; bottom: 10px; color: #8a96ad; font: 12px system-ui, sans-serif; }
  </style>
  <!-- Replace this whole file with your own three.js page. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hint">Drag to orbit · scroll to zoom</div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0f17);
    scene.fog = new THREE.Fog(0x0b0f17, 60, 140);

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
    camera.position.set(45, 40, 45);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;

    scene.add(new THREE.HemisphereLight(0x9bb7ff, 0x1a1f2b, 0.8));
    const sun = new THREE.DirectionalLight(0xffffff, 1.6);
    sun.position.set(30, 60, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60 });
    scene.add(sun);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0x1b2230 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Procedural city blocks
    const grid = 14, spacing = 5;
    const box = new THREE.BoxGeometry(1, 1, 1);
    box.translate(0, 0.5, 0);
    const palette = [0x3a4a6b, 0x4f8cff, 0x6b7fa8, 0x2c3650, 0x8fa8d8];
    for (let x = -grid / 2; x < grid / 2; x++) {
      for (let z = -grid / 2; z < grid / 2; z++) {
        if (Math.random() < 0.12) continue; // leave some plazas
        const dist = Math.hypot(x, z);
        const h = Math.max(1.5, (12 - dist) * (0.6 + Math.random()) * 1.6);
        const mat = new THREE.MeshStandardMaterial({
          color: palette[(Math.random() * palette.length) | 0],
          roughness: 0.6,
          metalness: 0.2,
        });
        const b = new THREE.Mesh(box, mat);
        b.scale.set(2.5 + Math.random() * 1.2, h, 2.5 + Math.random() * 1.2);
        b.position.set(x * spacing + spacing / 2, 0, z * spacing + spacing / 2);
        b.castShadow = b.receiveShadow = true;
        scene.add(b);
      }
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
